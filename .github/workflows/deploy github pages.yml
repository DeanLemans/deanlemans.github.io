name: Deploy to GitHub Pages
on:
  push:
    branches:
      - v4
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "github-pages"
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Set CACHE_CLEAR variable
        run: echo "CACHE_CLEAR=$(date +%s)" >> $GITHUB_ENV
      - name: Setup pnpm and install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile

      - name: Build Quartz
        env:
          CACHE_CLEAR: ${{ env.CACHE_CLEAR }}
        run: npx quartz build
      - name: Make fingerprint script executable
        run: chmod +x ./scripts/fingerprint-assets.sh
      - name: Fingerprint CSS/JS assets (post-build)
        run: ./scripts/fingerprint-assets.sh public
      - name: Force cache bust by touching any remaining files
        run: find public -type f -exec touch {} +
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Publish URL output
        run: "echo Pages deployment finished. URL: ${{ steps.deployment.outputs.page_url }}"
