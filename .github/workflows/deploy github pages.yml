name: Deploy to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Fetch all history for git info

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set CACHE_CLEAR variable
        run: echo "CACHE_CLEAR=$(date +%s)" >> $GITHUB_ENV

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        env:
          CACHE_CLEAR: ${{ env.CACHE_CLEAR }}
        run: npx quartz build

      # --- Post-build: fingerprint assets and robust cache-busting ---
      - name: Make fingerprint script executable
        run: chmod +x ./scripts/fingerprint-assets.sh

      - name: Fingerprint CSS/JS assets (post-build)
        run: |
          # Fingerprint assets under the site output dir. The script will rename files
          # like `main.css` -> `main.<hash>.css` and update references in HTML/CSS/JS.
          ./scripts/fingerprint-assets.sh public

      - name: Force cache bust by touching any remaining files
        run: find public -type f -exec touch {} +

      # --- Upload site ---
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # Give GitHub Pages a moment to accept the deployment and populate page_url
      - name: Wait a little for Pages to become reachable
        run: |
          echo "Waiting for Pages to finalize..."
          for i in 1 2 3 4 5; do
            sleep 5
            echo "waited $((i * 5))s"
          done

      # Trigger a Pages rebuild (this requests GitHub Pages to rebuild the site and helps purge CDN)
      - name: Trigger Pages rebuild (purge CDN)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          owner_repo="${{ github.repository }}"
          echo "Triggering Pages rebuild for $owner_repo"
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${owner_repo}/pages/builds" || true

      # Retry once after a short delay to increase likelihood caches are refreshed
      - name: Retry Pages rebuild (optional)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 10
          owner_repo="${{ github.repository }}"
          echo "Retrying Pages rebuild for $owner_repo"
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${owner_repo}/pages/builds" || true

      # Provide a final reminder/log with the published URL
      - name: Publish URL output
        run: |
          echo "Pages deployment finished. URL (may take a moment to propagate): ${{ steps.deployment.outputs.page_url }}"
